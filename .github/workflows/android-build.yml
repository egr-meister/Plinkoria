name: Android Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_VERSION: "8.9"
      BUILD_TOOLS: "36.0.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships the Android SDK + cmdline-tools; use its sdkmanager directly
      # (android-actions/setup-android tries to install the removed legacy 'tools' package).
      - name: Install SDK Platform 36 + Build Tools 36.0.0
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          fi
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;${BUILD_TOOLS}" "platform-tools"

      - name: Set up Gradle (fixed version — committed wrapper not required)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing — refusing to build an unsigned/debug-signed release."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build signed release APK + AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify APK signature (fail on debug cert)
        run: |
          set -o pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          if [ -z "$APK" ]; then echo "::error::No release APK produced"; exit 1; fi
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apksigner.txt
          if grep -q "CN=Android Debug" apksigner.txt; then
            echo "::error::Release APK is signed with the Android DEBUG certificate."
            exit 1
          fi
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apksigner.txt \
            || { echo "::error::APK v2 signature verification failed"; exit 1; }

      - name: Verify AAB signature
        run: |
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -n 1)
          if [ -z "$AAB" ]; then echo "::error::No release AAB produced"; exit 1; fi
          jarsigner -verify "$AAB" > jarsigner.txt 2>&1 || { cat jarsigner.txt; echo "::error::AAB signature verification failed"; exit 1; }
          grep -q "jar verified" jarsigner.txt || { cat jarsigner.txt; echo "::error::AAB is not signed"; exit 1; }
          if keytool -printcert -jarfile "$AAB" | grep -q "CN=Android Debug"; then
            echo "::error::AAB is signed with the Android DEBUG certificate."
            exit 1
          fi
          echo "AAB signature OK"

      - name: Check 16 KB page-size readiness (no native libs expected)
        run: |
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -n 1)
          if unzip -l "$AAB" | grep -E '\.so$'; then
            echo "::warning::Native libraries found — verify 16 KB alignment with zipalign -c -P 16 / bundletool."
          else
            echo "No native .so files — 16 KB memory page size compatible."
          fi

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      - name: Upload release APK (testing only)
        uses: actions/upload-artifact@v4
        with:
          name: plinkoria-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload release AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: plinkoria-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
